name: Feature Request
description: Propose a Stellar/Soroban feature
labels: [frontend, stellar]
body:
  - type: input
    id: title
    attributes: { label: Title, placeholder: Add XLM funding via Soroban } 
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why (user impact) }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria (checklist) }
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2]
      default: 1
